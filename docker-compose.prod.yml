services:
  mysql:
    image: mysql:8.0
    container_name: campuseats-mysql
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: campuseats_prod
      MYSQL_USER: "${MYSQL_USER}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always
    networks:
      - campuseats-networks
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-u","root","-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s


  redis:
    image: redis:7.0
    container_name: campuseats-redis
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - campuseats-networks

  backend:
    image: gigglen/campuseats-backend:latest
    container_name: campuseats-backend
    env_file:
      - .env.prod
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.campuseats-api.rule=Host(`campuseats-api.yuhanwang.dev`)"
      - "traefik.http.routers.campuseats-api.entrypoints=websecure"
      - "traefik.http.routers.campuseats-api.tls.certresolver=myresolver"
      - "traefik.http.services.campuseats-api.loadbalancer.server.port=8090"
    networks:
      - campuseats-networks
      - traefik-proxy

  customer-app:
    image: gigglen/campuseats-customer-app:latest
    container_name: campuseats-customer-app
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.campuseats-customer.rule=Host(`campuseats.yuhanwang.dev`)"
      - "traefik.http.routers.campuseats-customer.entrypoints=websecure"
      - "traefik.http.routers.campuseats-customer.tls.certresolver=myresolver"
      - "traefik.http.services.campuseats-customer.loadbalancer.server.port=3000"
    networks:
      - campuseats-networks
      - traefik-proxy

  console-app:
    image: gigglen/campuseats-console-app:latest
    container_name: campuseats-console-app
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.campuseats-admin.rule=Host(`campuseats-admin.yuhanwang.dev`)"
      - "traefik.http.routers.campuseats-admin.entrypoints=websecure"
      - "traefik.http.routers.campuseats-admin.tls.certresolver=myresolver"
      - "traefik.http.services.campuseats-admin.loadbalancer.server.port=3001"
    networks:
      - campuseats-networks
      - traefik-proxy


volumes:
  mysql_data:
  redis_data:

networks:
  campuseats-networks:
    driver: bridge
  traefik-proxy:
    external: true