# campuseats.yuhanwang.dev (customer-app)
server {
    listen 80;
    listen [::]:80;
    server_name campuseats.yuhanwang.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name campuseats.yuhanwang.dev;

    ssl_certificate /etc/letsencrypt/live/api.campuseats.yuhanwang.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.campuseats.yuhanwang.dev/privkey.pem;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://customer-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

