version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: canteen-hub-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: canteen_hub
    volumes:
      - canteen_mysql_data:/var/lib/mysql

  redis:
    image: redis:7.0
    container_name: canteen-hub-redis
    ports:
      - "6379:6379"
volumes:
  canteen_mysql_data: